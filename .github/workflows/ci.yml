name: CI Pipeline
 
on:
  pull_request:
    branches: [main]
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
 
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.1111'
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Set PYTHONPATH
        run: echo "::set-env name=PYTHONPATH::$GITHUB_WORKSPACE"
 
      - name: Run tests
        run: |
          echo "::set-output name=status::running"
          pytest --tb=short -v